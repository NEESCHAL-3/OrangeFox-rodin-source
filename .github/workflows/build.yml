name: OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      branch:
        description: OrangeFox sync branch
        required: true
        default: "14.1"
      runner:
        description: Runner label
        required: true
        default: "ubuntu-latest"

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 720

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio curl device-tree-compiler flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lz4 pngcrush rsync schedtool \
            squashfs-tools unzip xsltproc zip zlib1g-dev mkbootimg

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Show runner resources
        shell: bash
        run: |
          df -h
          free -h

      - name: Sync OrangeFox
        shell: bash
        run: |
          set -euo pipefail
          (
            while sleep 60; do
              echo "Heartbeat..."
              df -h
              free -h
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill "$HEARTBEAT_PID" 2>/dev/null || true' EXIT

          git clone https://gitlab.com/OrangeFox/sync.git "$GITHUB_WORKSPACE/ofox-sync"
          cd "$GITHUB_WORKSPACE/ofox-sync"

          ./orangefox_sync.sh \
            --branch "${{ inputs.branch }}" \
            --path "$GITHUB_WORKSPACE/OrangeFox"

          kill "$HEARTBEAT_PID" 2>/dev/null || true
          trap - EXIT

      - name: Copy rodin device tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox/device/xiaomi"

          rsync -a --delete \
            --exclude ".git" \
            --exclude "images" \
            "$GITHUB_WORKSPACE/device-tree/" \
            "$GITHUB_WORKSPACE/OrangeFox/device/xiaomi/rodin/"

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/ofox-sync"

          SWAPSIZE=12G \
            "$GITHUB_WORKSPACE/OrangeFox/device/xiaomi/rodin/.github/scripts/setup-swap.sh"

          df -h
          free -h

      - name: Apply and verify rodin source patches
        shell: bash
        working-directory: ${{ github.workspace }}/OrangeFox
        env:
          RODIN_FIRMWARE_VARIANT: india
        run: |
          set -euo pipefail

          device/xiaomi/rodin/tools/apply-orangefox-patches.sh \
            "$GITHUB_WORKSPACE/OrangeFox"

      - name: Build system-compatible OrangeFox
        shell: bash
        working-directory: ${{ github.workspace }}/OrangeFox
        env:
          RODIN_FIRMWARE_VARIANT: india
          GOMEMLIMIT: "3GiB"
          _JAVA_OPTIONS: "-Xmx3g"
          USE_CCACHE: "0"
        run: |
          set -eo pipefail

          device/xiaomi/rodin/build-lowmem.sh vendorbootimage \
            2>&1 | tee "$GITHUB_WORKSPACE/orangefox-build.log"

      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          PRODUCT="$GITHUB_WORKSPACE/OrangeFox/out/target/product/rodin"

          if [ -d "$PRODUCT" ]; then
            find "$PRODUCT" \
              -maxdepth 1 \
              -type f \
              \( -name "*.img" -o -name "*.zip" -o -name "*.txt" \) \
              -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;
          fi

          cp -v "$GITHUB_WORKSPACE/orangefox-build.log" "$GITHUB_WORKSPACE/artifacts/" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-rodin-india
          path: artifacts
          if-no-files-found: warn
